name: Deploy Ledger PWA to GitHub Pages

# 무빌드 PWA — 앱 파일을 그대로 GitHub Pages로 발행한다.
# 배포 전에 반드시 테스트를 통과해야 한다(특히 동기화 안전장치: 되돌아가면 사용자 데이터가 날아감).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 1개만 (최신 우선)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 의존성 설치 (테스트 전용)
        run: npm install --no-audit --no-fund
      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 테스트 실행
        run: npm test

  deploy:
    # 테스트가 통과한 main push만 배포
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Pages가 아직 비활성이면 워크플로우가 직접 활성화(수동 설정 불필요).
          enablement: true
      - name: 배포할 앱 파일만 모으기
        # 테스트·설정 파일이 공개 사이트에 올라가지 않도록 앱 자산만 복사한다.
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r css js icons _site/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
